<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <radialGradient id="bellGrad" cx="40%" cy="35%" r="60%">
      <stop offset="0%" stop-color="#FFFDE7"/>
      <stop offset="35%" stop-color="#FFEB3B"/>
      <stop offset="75%" stop-color="#FBC02D"/>
      <stop offset="100%" stop-color="#F57F17"/>
    </radialGradient>
    <filter id="bBloom" x="-25%" y="-25%" width="150%" height="150%">
      <feGaussianBlur stdDeviation="1.5" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Top Ring -->
  <ellipse cx="32" cy="13" rx="4.5" ry="3" fill="none" stroke="url(#bellGrad)" stroke-width="2.5" filter="url(#bBloom)"/>

  <!-- Bell Clapper -->
  <circle cx="32" cy="51" r="5" fill="#FFE082" stroke="#E65100" stroke-width="1.2" filter="url(#bBloom)"/>
  <ellipse cx="32" cy="49" rx="16" ry="4" fill="#3E2723" opacity="0.6"/>

  <!-- Bell Body -->
  <path d="M 32 15 C 24 15, 20 25, 19 36 C 18 43, 13 47, 13 50 C 13 52, 20 54, 32 54 C 44 54, 51 52, 51 50 C 51 47, 46 43, 45 36 C 44 25, 40 15, 32 15 Z" fill="url(#bellGrad)" stroke="#FFF9C4" stroke-width="1" filter="url(#bBloom)"/>

  <!-- Cyan Sound Waves (Left) -->
  <path d="M 8 26 C 5 32, 5 40, 8 46" fill="none" stroke="#00E5FF" stroke-width="2.5" stroke-linecap="round" opacity="0.9"/>
  <path d="M 4 21 C -1 31, -1 44, 4 52" fill="none" stroke="#00E5FF" stroke-width="2.5" stroke-linecap="round" opacity="0.6"/>

  <!-- Cyan Sound Waves (Right) -->
  <path d="M 56 26 C 59 32, 59 40, 56 46" fill="none" stroke="#00E5FF" stroke-width="2.5" stroke-linecap="round" opacity="0.9"/>
  <path d="M 60 21 C 65 31, 65 44, 60 52" fill="none" stroke="#00E5FF" stroke-width="2.5" stroke-linecap="round" opacity="0.6"/>
</svg>
