<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 110" width="100%" height="100%">
  <defs>
    <!-- Gold metallic gradients -->
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFDE7"/>
      <stop offset="25%" stop-color="#FFD700"/>
      <stop offset="55%" stop-color="#FFA000"/>
      <stop offset="85%" stop-color="#FF6F00"/>
      <stop offset="100%" stop-color="#E65100"/>
    </linearGradient>

    <linearGradient id="rubyGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF5252"/>
      <stop offset="50%" stop-color="#D50000"/>
      <stop offset="100%" stop-color="#880000"/>
    </linearGradient>

    <filter id="goldBloom" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="1.5" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Crown Base & Spikes at Top -->
  <g filter="url(#goldBloom)">
    <!-- Crown Spikes -->
    <polygon points="16,28 24,10 35,22 50,2 65,22 76,10 84,28" fill="url(#goldGrad)" stroke="#FFF" stroke-width="0.8"/>
    <!-- Ruby tips on spikes -->
    <circle cx="24" cy="10" r="2.8" fill="url(#rubyGrad)" stroke="#FFF" stroke-width="0.6"/>
    <circle cx="50" cy="3" r="3.6" fill="url(#rubyGrad)" stroke="#FFF" stroke-width="0.8"/>
    <circle cx="76" cy="10" r="2.8" fill="url(#rubyGrad)" stroke="#FFF" stroke-width="0.6"/>

    <!-- Central Crest with Rank 1 -->
    <circle cx="50" cy="20" r="10.5" fill="url(#goldGrad)" stroke="#FFFFFF" stroke-width="1.2"/>
    <circle cx="50" cy="20" r="8" fill="#1A0D00"/>
    <text x="50" y="25" font-family="'Montserrat', 'Arial Black', sans-serif" font-weight="900" font-size="14" fill="#FFD700" text-anchor="middle">1</text>
  </g>

  <!-- Ornate Outer Frame Border -->
  <rect x="7" y="23" width="86" height="82" rx="7" fill="none" stroke="url(#goldGrad)" stroke-width="4" filter="url(#goldBloom)"/>
  <rect x="11" y="27" width="78" height="74" rx="5" fill="none" stroke="#FFF" stroke-width="0.8" opacity="0.75"/>

  <!-- Ornate Corner Jewels (Rubies) -->
  <g filter="url(#goldBloom)">
    <!-- Top Left Corner -->
    <circle cx="8" cy="25" r="3.8" fill="url(#rubyGrad)" stroke="url(#goldGrad)" stroke-width="1"/>
    <!-- Top Right Corner -->
    <circle cx="92" cy="25" r="3.8" fill="url(#rubyGrad)" stroke="url(#goldGrad)" stroke-width="1"/>
    <!-- Bottom Left Corner -->
    <circle cx="8" cy="103" r="3.8" fill="url(#rubyGrad)" stroke="url(#goldGrad)" stroke-width="1"/>
    <!-- Bottom Right Corner -->
    <circle cx="92" cy="103" r="3.8" fill="url(#rubyGrad)" stroke="url(#goldGrad)" stroke-width="1"/>
    <!-- Bottom Center Flourish -->
    <polygon points="50,103 44,108 50,110 56,108" fill="url(#goldGrad)"/>
    <circle cx="50" cy="107" r="2" fill="url(#rubyGrad)"/>

    <!-- Sparkle Stars at Upper Corners -->
    <polygon points="12,17 13.5,20.5 17,22 13.5,23.5 12,27 10.5,23.5 7,22 10.5,20.5" fill="#FFF"/>
    <polygon points="88,17 89.5,20.5 93,22 89.5,23.5 88,27 86.5,23.5 83,22 86.5,20.5" fill="#FFF"/>
  </g>
</svg>
