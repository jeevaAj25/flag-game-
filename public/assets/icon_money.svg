<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <radialGradient id="moneyGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FFF59D"/>
      <stop offset="40%" stop-color="#FFD700"/>
      <stop offset="85%" stop-color="#FFB300"/>
      <stop offset="100%" stop-color="#FF8F00"/>
    </radialGradient>
    <filter id="mBloom" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="1.5" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  <!-- Tied Top Flares -->
  <path d="M 28 20 C 24 12, 30 7, 34 8 C 38 9, 39 14, 36 20 Z" fill="url(#moneyGlow)" filter="url(#mBloom)"/>
  <path d="M 33 20 C 32 11, 40 8, 43 11 C 45 14, 42 18, 37 20 Z" fill="url(#moneyGlow)" filter="url(#mBloom)"/>
  
  <!-- Rope / Tie -->
  <path d="M 26 21 Q 34 23 42 20 Q 34 25 26 21 Z" fill="#8D6E63" stroke="#5D4037" stroke-width="1"/>

  <!-- Main Bag Body -->
  <path d="M 27 21 C 14 26, 8 40, 12 51 C 16 60, 48 62, 53 52 C 58 41, 52 26, 39 21 Z" fill="url(#moneyGlow)" filter="url(#mBloom)" stroke="#FFE082" stroke-width="0.8"/>

  <!-- Dollar Sign $ -->
  <text x="32" y="45" font-family="'Montserrat', 'Arial Black', sans-serif" font-weight="900" font-size="22" fill="#5D4037" text-anchor="middle" filter="drop-shadow(0px 1px 1px rgba(255,255,255,0.4))">$</text>
</svg>
